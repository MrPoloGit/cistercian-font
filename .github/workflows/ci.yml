name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"
      - name: ruff format --check
        run: ruff format --check src tests
      - name: ruff check
        run: ruff check src tests
      - name: mypy --strict
        run: mypy src
      - name: Validate spec files
        run: |
          python -c "from cistercian.geometry import load_digit_spec; load_digit_spec('spec/digits.json')"
          python -c "from cistercian.features import load_letter_spec; load_letter_spec('spec/letters.json')"
      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
