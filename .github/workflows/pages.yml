name: Deploy demo to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Build the font
        run: cistercian build --out site --formats woff2
      - name: Assemble the Pages site
        run: |
          cp demo/index.html site/index.html
          cp demo/demo.js site/demo.js
          sed -E 's#url\("\.\./dist/Cistercian-Regular\.woff2[^"]*"\)#url("Cistercian-Regular.woff2")#' \
            demo/demo.css > site/demo.css
      - uses: actions/configure-pages@v5
        id: pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
