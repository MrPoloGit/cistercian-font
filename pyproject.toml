[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cistercian"
version = "0.1.0"
description = "A font that renders Cistercian numerals and A-Z as numerals"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "fonttools>=4.50",
  "shapely>=2.0",
  "jsonschema>=4.17",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "uharfbuzz>=0.40",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
cistercian = "cistercian.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["fontTools.*", "shapely.*", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/cistercian"]
